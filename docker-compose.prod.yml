name: bogaap-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.13.3-management
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-rabbitmq
    restart: unless-stopped
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-384m}
    cpus: ${RABBITMQ_CPUS:-0.20}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in your environment file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in your environment file}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS:--rabbit vm_memory_high_watermark.relative 0.4}
    ports:
      - "${RABBITMQ_BIND_HOST:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_BIND_HOST:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY_ID} $${STORAGE_SECRET_ACCESS_KEY}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${STORAGE_BUCKET};
      "
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-bogaap-api:prod}
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_CORS_MODE: strict
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:?API_CORS_ALLOWED_ORIGINS is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      EXPENSE_OVERDUE_SCHEDULER_ENABLED: ${EXPENSE_OVERDUE_SCHEDULER_ENABLED:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      ATTACHMENT_UPLOAD_RATE_LIMIT_MAX: ${ATTACHMENT_UPLOAD_RATE_LIMIT_MAX:-20}
      ATTACHMENT_UPLOAD_RATE_LIMIT_WINDOW_MS: ${ATTACHMENT_UPLOAD_RATE_LIMIT_WINDOW_MS:-60000}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in your environment file}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in your environment file}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-bogaap.jobs}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-bogaap.notifications}
      RABBITMQ_DOCUMENT_CLEANUP_QUEUE: ${RABBITMQ_DOCUMENT_CLEANUP_QUEUE:-bogaap.document-cleanup}
      ASYNC_OUTBOX_PUBLISHER_ENABLED: "false"
      DOCUMENT_CLEANUP_INLINE_PROCESSING_ENABLED: ${DOCUMENT_CLEANUP_INLINE_PROCESSING_ENABLED:-false}
      DOCUMENT_CLEANUP_SCHEDULER_ENABLED: ${DOCUMENT_CLEANUP_SCHEDULER_ENABLED:-false}
      NOTIFICATIONS_SCHEDULER_ENABLED: ${NOTIFICATIONS_SCHEDULER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3001"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${WORKER_IMAGE:-bogaap-worker:prod}
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-worker
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPUS:-0.25}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=256}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public&connection_limit=${WORKER_DATABASE_CONNECTION_LIMIT:-2}&pool_timeout=${DATABASE_POOL_TIMEOUT:-20}
      REDIS_URL: redis://redis:6379
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in your environment file}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in your environment file}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-bogaap.jobs}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-bogaap.notifications}
      RABBITMQ_DOCUMENT_CLEANUP_QUEUE: ${RABBITMQ_DOCUMENT_CLEANUP_QUEUE:-bogaap.document-cleanup}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-3}
      RABBITMQ_CONSUMER_RETRY_INTERVAL_MS: ${RABBITMQ_CONSUMER_RETRY_INTERVAL_MS:-5000}
      ASYNC_OUTBOX_PUBLISHER_ENABLED: ${ASYNC_OUTBOX_PUBLISHER_ENABLED:-true}
      ASYNC_OUTBOX_PUBLISHER_INTERVAL_MS: ${ASYNC_OUTBOX_PUBLISHER_INTERVAL_MS:-5000}
      ASYNC_OUTBOX_PUBLISHER_BATCH_SIZE: ${ASYNC_OUTBOX_PUBLISHER_BATCH_SIZE:-25}
      ASYNC_OUTBOX_DATABASE_RETRY_ATTEMPTS: ${ASYNC_OUTBOX_DATABASE_RETRY_ATTEMPTS:-5}
      ASYNC_OUTBOX_DATABASE_RETRY_BASE_DELAY_MS: ${ASYNC_OUTBOX_DATABASE_RETRY_BASE_DELAY_MS:-250}
      DOCUMENT_CLEANUP_INLINE_PROCESSING_ENABLED: ${DOCUMENT_CLEANUP_INLINE_PROCESSING_ENABLED:-false}
      DOCUMENT_CLEANUP_SCHEDULER_ENABLED: ${DOCUMENT_CLEANUP_SCHEDULER_ENABLED:-false}
      DOCUMENT_CLEANUP_RECOVERY_INTERVAL_MS: ${DOCUMENT_CLEANUP_RECOVERY_INTERVAL_MS:-600000}
      NOTIFICATIONS_SCHEDULER_ENABLED: ${NOTIFICATIONS_SCHEDULER_ENABLED:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${WEB_IMAGE:-bogaap-web:prod}
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
      NEXT_PUBLIC_APP_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
      AUTH_COOKIE_SECURE: "true"
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_API_PROXY_ORIGIN: http://api:3001
    depends_on:
      api:
        condition: service_started
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started

  certbot:
    image: certbot/certbot:latest
    container_name: ${CONTAINER_PREFIX:-bogaap-prod}-certbot
    profiles:
      - certbot
    ports:
      - "80:80"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  certbot_www:
  letsencrypt:
