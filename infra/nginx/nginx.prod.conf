events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/javascript application/json application/wasm application/xml
    font/opentype image/svg+xml text/css text/javascript text/plain text/xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream temis_web {
    server web:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name temis.ar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://temis.ar$request_uri; }
  }

  server {
    listen 80;
    server_name platform.temis.ar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://platform.temis.ar$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name temis.ar;
    ssl_certificate /etc/letsencrypt/live/temis.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temis.ar/privkey.pem;
    include /etc/nginx/tls-common.conf;
    access_log /var/log/nginx/temis.access.log;
    error_log /var/log/nginx/temis.error.log warn;
    include /etc/nginx/proxy-common.conf;

    location = /api/notifications/stream {
      proxy_pass http://temis_web;
      include /etc/nginx/proxy-headers.conf;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      proxy_pass http://temis_web;
      include /etc/nginx/proxy-headers.conf;
      # Always erase device headers on the tenant host, even if supplied by a client.
      proxy_set_header X-Temis-Mtls-Verified "";
      proxy_set_header X-Temis-Device-Certificate-Fingerprint "";
      proxy_set_header X-Temis-Device-Id "";
      proxy_redirect off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_connect_timeout 10s;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name platform.temis.ar;
    ssl_certificate /etc/letsencrypt/live/temis.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temis.ar/privkey.pem;
    include /etc/nginx/tls-common.conf;
    include /etc/nginx/platform-security.conf;
    access_log /var/log/nginx/platform.access.log;
    error_log /var/log/nginx/platform.error.log warn;
    include /etc/nginx/proxy-common.conf;

    location = /api/notifications/stream {
      return 404;
    }

    location / {
      proxy_pass http://temis_web;
      include /etc/nginx/proxy-headers.conf;
      # These values replace any client-supplied headers and come only from TLS state.
      proxy_set_header X-Temis-Mtls-Verified $ssl_client_verify;
      proxy_set_header X-Temis-Device-Certificate-Fingerprint $ssl_client_fingerprint;
      proxy_set_header X-Temis-Device-Id $ssl_client_s_dn;
      proxy_redirect off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_connect_timeout 10s;
    }
  }
}
